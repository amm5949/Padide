<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیش‌نمایش بصری — پدیده پایدار</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--fg:#1b2944;--muted:#71809a;--border:#e5eaf2;--primary:#3548b9;--secondary:#eef2ff;--shadow:0 8px 32px #2135620b}

*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font:14px/1.85 Tahoma,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--primary);outline-offset:3px}a{text-decoration:none;color:inherit}.sidebar{position:fixed;inset:0 0 0 auto;width:270px;background:var(--card);border-left:1px solid var(--border);padding:22px 16px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:12px;padding:5px 9px 30px}.brand-icon{display:grid;place-items:center;width:45px;height:45px;background:linear-gradient(135deg,#3145b5,#7560bb);color:white;border-radius:15px;font-size:22px;font-weight:bold}.brand small{color:var(--muted);font-size:10px}.nav-title{color:var(--muted);font-size:11px;padding:0 12px 12px;font-weight:bold}.nav-list{display:grid;gap:4px}.nav{border:0;background:transparent;color:var(--muted);text-align:right;padding:12px 13px;border-radius:12px;display:flex;gap:12px;align-items:center;width:100%;font-weight:bold;font-size:13px}.nav b{font-size:18px;font-weight:normal}.nav.active{background:var(--secondary);color:var(--primary)}.nav:hover{background:var(--secondary)}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:15px;color:var(--muted);font-size:11px}.demo-note{background:var(--bg);padding:12px;border-radius:12px}.mainwrap{margin-right:270px;min-width:0}.topbar{height:69px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 38px;position:sticky;top:0;z-index:3;gap:10px}.breadcrumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:8px}.top-actions select,.top-actions button{border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--fg);padding:9px;min-height:41px}.avatar{height:35px;width:35px;display:grid;place-items:center;border-radius:50%;background:var(--secondary);color:var(--primary);font-weight:bold}.content{max-width:1440px;margin:auto;padding:28px 38px 50px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:25px}.eyebrow{font-size:11px;color:var(--primary);font-weight:bold}.page-head h1{margin:4px 0 3px;font-size:25px;letter-spacing:-.4px}.description{color:var(--muted);font-size:13px}.button{border:0;border-radius:11px;padding:10px 16px;min-height:44px;background:var(--primary);color:white;font-weight:bold;font-size:13px;white-space:nowrap}.dark .button{color:#101727}.button.white{color:#243784;background:#fff}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#3145b5,#6658b3);border-radius:22px;padding:32px;color:white;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:23px}.hero:before{content:'';position:absolute;width:270px;height:270px;border:42px solid #ffffff0d;border-radius:100%;left:-130px;top:-150px}.hero>*{position:relative}.hero h2{font-size:23px;line-height:1.6;margin:2px 0}.hero p{font-size:12px;color:#e2e5ff;max-width:510px;margin:7px 0}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:21px}.metric{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:17px;padding:20px}.metric-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.circle{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:#eef2ff;color:#3349b9;font-size:19px}.dark .circle{background:#283456;color:#b6c1ff}.metric strong{font-size:29px;display:block;margin-top:4px}.metric small{color:var(--muted);font-size:11px}.twocol{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}.panel{border:1px solid var(--border);border-radius:17px;background:var(--card);box-shadow:var(--shadow);padding:22px;margin-bottom:20px;min-width:0}.panel-title{font-size:16px;font-weight:bold;margin-bottom:3px}.panel-sub{font-size:11px;color:var(--muted);margin-bottom:18px}.quick{border:1px solid var(--border);padding:14px;border-radius:13px;display:flex;align-items:center;gap:12px;margin-top:10px}.quick .circle{width:41px;height:41px}.quick span{flex:1}.quick small{display:block;color:var(--muted);font-size:11px}.quick strong{font-size:13px}.quick em{font-style:normal;color:var(--primary)}.bar-area{height:210px;display:flex;align-items:end;justify-content:space-around;gap:12px;padding-top:20px;border-bottom:1px solid var(--border)}.bar-holder{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px}.bar{width:100%;max-width:35px;background:#bfc7f2;border-radius:7px 7px 0 0}.bar.strong{background:#3548b9}.bar-holder small{color:var(--muted);font-size:10px;white-space:nowrap}.recents{display:grid}.recent{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--border)}.recent:last-child{border-bottom:0}.recent small{display:block;color:var(--muted)}.status{font-size:10px;font-weight:bold;padding:5px 10px;border-radius:30px;white-space:nowrap}.status.pending{background:#fff6e7;color:#94600f}.status.approved{background:#e7f8f2;color:#116c51}.status.changes{background:#ebf2ff;color:#335ca4}.status.rejected{background:#ffecef;color:#b53249}.dark .status.pending{background:#493920;color:#ffd28b}.dark .status.approved{background:#184d40;color:#b3ffe0}.dark .status.changes{background:#253c67;color:#c8dcff}.dark .status.rejected{background:#512934;color:#ffbac8}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}.toolbar input,.toolbar select,.input{min-height:43px;background:var(--card);border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:8px 12px;width:100%}.toolbar input{max-width:300px}.toolbar select{max-width:175px}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;font-size:12px;text-align:right;min-width:730px}.table th{background:var(--bg);text-align:right;color:var(--muted);font-weight:bold;padding:15px 13px}.table td{border-bottom:1px solid var(--border);padding:14px 13px}.table td:first-child{font-weight:bold}.table tr:last-child td{border:0}.cards-mobile{display:none}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field label{font-size:12px;font-weight:bold;display:block;margin-bottom:5px}.field .hint{font-size:10px;color:var(--muted);margin-top:3px}.steps{display:flex;gap:8px;margin-bottom:24px}.step{flex:1;text-align:center;font-size:10px;color:var(--muted);border-top:4px solid var(--border);padding-top:10px}.step.selected{border-color:var(--primary);color:var(--primary)}.upload-box{border:2px dashed var(--border);border-radius:18px;background:var(--bg);min-height:240px;display:grid;place-items:center;text-align:center;padding:35px}.upload-box span{font-size:35px}.mobilebar{display:none}.menu-btn{display:none}.footer{color:var(--muted);font-size:11px;margin-top:20px;border-top:1px solid var(--border);padding-top:17px}.hide{display:none!important}
@media(max-width:1199px){.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.content{padding:25px}.topbar{padding:0 25px}}
@media(max-width:900px){.sidebar{transform:translateX(110%);transition:transform .2s;box-shadow:0 0 40px #0002}.sidebar.open{transform:none}.mainwrap{margin-right:0}.menu-btn{display:block}.topbar{padding:0 16px}.content{padding:20px 15px 100px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;height:72px;background:var(--card);border-top:1px solid var(--border);align-items:center;justify-content:space-around;z-index:4}.mobilebar button{border:0;background:transparent;color:var(--muted);font-size:11px}.mobilebar button.active{color:var(--primary)}.mobilebar b{display:block;font-size:21px}.page-head h1{font-size:21px}.table-wrap{display:none}.cards-mobile{display:grid;gap:10px}.mobile-record{padding:16px;border:1px solid var(--border);border-radius:13px}.mobile-record .top{display:flex;justify-content:space-between;margin-bottom:10px}.mobile-record dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}.mobile-record dt{font-size:10px;color:var(--muted)}.mobile-record dd{margin:0;font-size:12px;font-weight:bold}.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.metric-grid{gap:10px}.metric{padding:15px}.metric strong{font-size:24px}.metric-top{font-size:10px}.hero{padding:23px;display:block}.hero h2{font-size:19px}.hero .button{margin-top:18px}.page-head{display:block}.description{font-size:12px}.form-grid{grid-template-columns:1fr}.top-actions select{font-size:11px;max-width:93px}.avatar{display:none}.content{padding:18px 12px 100px}.panel{padding:17px}.steps{gap:4px}.step{font-size:9px}}
</style></head><body>
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">▤</div><div><strong>پدیده پایدار</strong><br><small>سامانه مدیریت مجوزها</small></div></div><div class="nav-title" id="nav-title">فضای مدیریت</div><nav class="nav-list" id="nav"></nav><div class="sidebar-bottom"><div class="demo-note"><strong>پیش‌نمایش بصری</strong><br>این HTML مستقل از برنامه Next.js است و به بک‌اند متصل نیست.</div></div></aside>
<div class="mainwrap"><header class="topbar"><div style="display:flex;align-items:center;gap:11px;min-width:0"><button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="بازکردن منو" style="border:0;background:transparent;color:var(--fg);font-size:24px">☰</button><span class="breadcrumb">سیستم مدیریت مجوزها ‹ <b id="breadcrumb">فضای مدیریت</b></span></div><div class="top-actions"><select id="role" aria-label="نقش پیش‌نمایش" onchange="changeRole(this.value)"><option value="admin">مدیر</option><option value="user">کاربر</option></select><button id="theme" onclick="toggleTheme()" aria-label="تغییر تم">☾</button><span class="avatar">م</span></div></header><main class="content" id="content"></main><nav class="mobilebar" id="mobilebar" aria-label="ناوبری موبایل"></nav></div>
<script>
let role='admin',view='home',dark=false;
const navs={admin:[['home','◫','نمای کلی'],['credit','▣','درخواست‌های اعتبار'],['checks','▤','مدیریت چک‌ها'],['statements','▧','اسناد بانکی'],['settings','⚙','تنظیمات']],user:[['home','◫','نمای کلی'],['credit','▣','درخواست اعتبار'],['checks','▤','تأیید چک'],['statements','⇧','پرینت حساب'],['requests','☷','پیگیری درخواست‌ها'],['settings','⚙','تنظیمات']]};
const rows=[['CR-1009','شرکت بازرگانی البرز','BR-001','۲۵۰٬۰۰۰٬۰۰۰','۱۶۰٬۰۰۰٬۰۰۰','در انتظار بررسی','pending'],['CR-1008','فروشگاه زنجیره‌ای رفاه','BR-002','۱۵۰٬۰۰۰٬۰۰۰','۹۵٬۰۰۰٬۰۰۰','تأیید شده','approved'],['CR-1007','صنایع غذایی سحر','BR-001','۵۰۰٬۰۰۰٬۰۰۰','۳۰۰٬۰۰۰٬۰۰۰','نیازمند اصلاح','changes'],['CR-1006','فروشگاه سپید','BR-003','۹۰٬۰۰۰٬۰۰۰','۶۰٬۰۰۰٬۰۰۰','رد شده','rejected']];
const badge=r=>`<span class="status ${r[6]}">${r[5]}</span>`;
function changeRole(r){role=r;view='home';render()}
function toggleTheme(){dark=!dark;document.documentElement.classList.toggle('dark',dark);document.getElementById('theme').textContent=dark?'☀':'☾'}
function navigate(v){view=v;document.getElementById('sidebar').classList.remove('open');render();scrollTo({top:0,behavior:'smooth'})}
function heading(title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${role==='admin'?'کارتابل مدیریت':'پیشخوان کاربری'}</div><h1>${title}</h1><div class="description">${desc}</div></div>${action}</div>`}
function home(){let admin=role==='admin';return heading(admin?'خوش آمدید، مدیر سامانه':'خوش آمدید به پدیده پایدار',admin?'بررسی وضعیت درخواست‌ها و دسترسی سریع به کارتابل مدیریت':'درخواست‌های خود را ثبت و مراحل بررسی آن‌ها را دنبال کنید.')+`<div class="hero"><div><small>شرکت پخش پدیده پایدار</small><h2>${admin?'کارتابل درخواست‌ها در یک نگاه':'مدیریت اعتبار، ساده و شفاف'}</h2><p>${admin?'برای بررسی پرونده‌ها، مدیریت چک‌ها و اسناد بانکی از منوی سمت راست استفاده کنید.':'ثبت درخواست، بارگذاری مدارک و مشاهده نتیجه بررسی بدون مراجعه حضوری.'}</p></div><button class="button white" onclick="navigate('credit')">${admin?'بررسی درخواست‌ها':'درخواست اعتبار جدید'} ↖</button></div><div class="metric-grid">${[['درخواست‌ها',admin?'۱۷':'۸','مجموع پرونده‌ها','▤'],['در انتظار بررسی',admin?'۶':'۳','نیازمند پیگیری','◷'],['تأیید شده',admin?'۵':'۳','پرونده‌های بررسی‌شده','✓'],['اسناد بانکی',admin?'۳':'۲','پرونده PDF نمایشی','▧']].map(x=>`<div class="metric"><div class="metric-top">${x[0]}<span class="circle">${x[3]}</span></div><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><div class="twocol"><section class="panel"><div class="panel-title">دسترسی سریع</div><div class="panel-sub">عملیات پرکاربرد سامانه</div>${(admin?[['credit','▣','درخواست‌های اعتبار','مشاهده و بررسی پرونده‌ها'],['checks','▤','مدیریت چک‌ها','اطلاعات چک و فاکتور'],['statements','▧','اسناد بانکی','بررسی پرینت حساب']]:[['credit','▣','درخواست اعتبار','فرم مرحله‌ای و بازبینی'],['checks','▤','درخواست تأیید چک','ثبت چک و فاکتور'],['statements','⇧','بارگذاری پرینت حساب','انتخاب فایل PDF']]).map(x=>`<a href="#" onclick="navigate('${x[0]}');return false" class="quick"><span class="circle">${x[1]}</span><span><strong>${x[2]}</strong><small>${x[3]}</small></span><em>↖</em></a>`).join('')}</section><section class="panel"><div class="panel-title">روند فعالیت</div><div class="panel-sub">نمودار نمونه · داده‌ها ساختگی هستند</div><div class="bar-area">${[38,61,44,78,57,91,24].map((v,i)=>`<div class="bar-holder"><div class="bar ${i===5?'strong':''}" style="height:${v}%"></div><small>${['شنبه','یک','دو','سه','چهار','پنج','جمعه'][i]}</small></div>`).join('')}</div><div class="panel-sub" style="margin-top:16px">پس از اتصال API، آمار واقعی نمایش داده می‌شود.</div></section></div><section class="panel"><div class="panel-title">آخرین درخواست‌ها</div><div class="panel-sub">نمونه وضعیت پرونده‌های اعتباری</div><div class="recents">${rows.map(r=>`<div class="recent"><span><strong>${r[1]}</strong><small>${r[0]} · ۱۴۰۵/۰۸/۲۷</small></span>${badge(r)}</div>`).join('')}</div></section>`}
function list(){let data=view==='checks'?[['CH-1005','مشتریان قراردادی','783671','۴۸۸٬۲۳۳٬۷۲۸','—','در انتظار بررسی','pending'],['CH-1004','مشتریان قراردادی','783671','۱۱٬۸۸۸٬۸۰۱٬۶۸۰','—','تأیید شده','approved']]:view==='statements'?[['ST-1003','صورت‌حساب بانکی آبان','statement-aban.pdf','۱٫۷ MB','—','در انتظار بررسی','pending'],['ST-1002','صورت‌حساب بانکی مهر','statement-mehr.pdf','۰٫۹ MB','—','تأیید شده','approved']]:rows;const title=view==='credit'?'درخواست‌های اعتبار':view==='checks'?'مدیریت چک‌ها':view==='statements'?'اسناد بانکی':'پیگیری درخواست‌های من';return heading(title,'جست‌وجو، فیلتر و مشاهده جزئیات پرونده‌ها')+`<section class="panel"><div class="toolbar"><strong>فهرست ${title}</strong><div style="display:flex;flex-wrap:wrap;gap:8px"><input id="q" oninput="filterList()" placeholder="جست‌وجو در پرونده‌ها..." aria-label="جست‌وجو"><select id="filter" onchange="filterList()"><option value="all">همه وضعیت‌ها</option><option value="pending">در انتظار بررسی</option><option value="approved">تأیید شده</option><option value="changes">نیازمند اصلاح</option><option value="rejected">رد شده</option></select></div></div><div class="table-wrap"><table class="table"><thead><tr><th>شناسه</th><th>عنوان / مشتری</th><th>${view==='checks'?'شماره چک':'کد شعبه'}</th><th>مبلغ</th><th>درخواست</th><th>وضعیت</th></tr></thead><tbody id="tbody">${data.map(r=>`<tr data-search="${r.join(' ').toLowerCase()}" data-status="${r[6]}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${badge(r)}</td></tr>`).join('')}</tbody></table></div><div class="cards-mobile" id="cards">${data.map(r=>`<div class="mobile-record" data-search="${r.join(' ').toLowerCase()}" data-status="${r[6]}"><div class="top"><b>${r[0]}</b>${badge(r)}</div><dl><div><dt>عنوان</dt><dd>${r[1]}</dd></div><div><dt>شعبه / شماره چک</dt><dd>${r[2]}</dd></div><div><dt>مبلغ</dt><dd>${r[3]}</dd></div></dl></div>`).join('')}</div><p class="panel-sub" style="margin-top:18px;margin-bottom:0">تمام اطلاعات این پیش‌نمایش ساختگی هستند.</p></section>`}
function filterList(){let text=(document.getElementById('q')?.value||'').toLowerCase();let status=document.getElementById('filter')?.value;document.querySelectorAll('[data-search]').forEach(el=>el.classList.toggle('hide',!(el.dataset.search.includes(text)&&(status==='all'||el.dataset.status===status))))}
let creditLabels=['کد مشتری','نام مشتری','کد شعبه','تلفن','نام واقعی','گروه مشتری','وضعیت مالکیت','نام فروشنده','تاریخ ثبت','تاریخ اولین فاکتور','کل خرید','خرید ۳ ماه گذشته','مبلغ مرجوعی','فروش خالص','تعداد فاکتورهای باز','مبلغ معوقات','تعداد چک برگشتی','مبلغ چک برگشتی','مبلغ چک‌های در جریان','کل بدهی','میانگین فروش روزانه','مبلغ فاکتورهای باز','میانگین خرید ماهانه','سقف اعتبار','دوره وصول','مبلغ درخواست جدید','تعداد درخواست اعتبار','اعتبار مازاد','مبلغ اعتبار درخواستی','شرایط فروش','درصد تخفیف کمیسیون','تخفیف حجمی','درصد تخفیف مازاد','درصد کل تخفیفات','تعداد کارتن','طرح درخواستی','نظر مالی','توضیحات'];let cstep=0;
function form(){let labels=view==='credit'?creditLabels:['شناسه','گروه مشتری','تاریخ فاکتور','مبلغ فاکتور','شماره چک','مبلغ چک','تاریخ سررسید چک','راس چک','وضعیت','نام فروشنده','وضعیت چک','گروه محصول'];let groups=view==='credit'?[labels.slice(0,10),labels.slice(10,23),labels.slice(23,29),labels.slice(29),[]]:[labels.slice(0,5),labels.slice(5)];let formTitle=view==='credit'?'درخواست اعتبار':'درخواست تأیید چک';return heading(formTitle,'نمونه بصری فرم با پوشش فیلدهای منبع')+`<section class="panel">${view==='credit'?`<div class="steps">${['مشتری و شعبه','فروش و بدهی','شاخص‌های اعتبار','شرایط و توضیحات','بازبینی'].map((x,i)=>`<div class="step ${cstep===i?'selected':''}">${i+1}. ${x}</div>`).join('')}</div>`:''}<div class="panel-title">${view==='credit'?['مشتری و شعبه','فروش و بدهی','شاخص‌های اعتبار','شرایط و توضیحات','بازبینی'][cstep]:'اطلاعات فاکتور و چک'}</div><div class="panel-sub">نام فیلدها از تصاویر موجود استخراج شده است.</div><div class="form-grid">${(view==='credit'?groups[cstep]:labels).map((x,i)=>`<div class="field"><label>${x}${i<3&&cstep===0?' *':''}</label><input class="input" placeholder="ورود ${x}" /></div>`).join('')||'<p>اطلاعات مراحل قبل را بازبینی کنید.</p>'}</div><div style="display:flex;justify-content:space-between;gap:10px;margin-top:30px;flex-wrap:wrap"><button class="button" style="background:var(--secondary);color:var(--primary)" onclick="cstep=Math.max(0,cstep-1);render()">مرحله قبل</button><button class="button" onclick="${view==='credit'?"if(cstep<4){cstep++;render()}else alert('این صرفاً پیش‌نمایش است؛ چیزی ثبت نمی‌شود.')":"alert('این صرفاً پیش‌نمایش است؛ چیزی ثبت نمی‌شود.')"}">${view==='credit'&&cstep<4?'مرحله بعد':'بررسی نمایشی'} ↖</button></div></section>`}
function upload(){return heading('بارگذاری پرینت حساب','فایل PDF بانکی را برای بررسی انتخاب کنید.')+`<section class="panel"><div class="panel-title">انتخاب فایل پرینت حساب</div><div class="panel-sub">فقط PDF · حداکثر ۱۰ مگابایت</div><div class="upload-box" id="drop"><div><span>⇧</span><h3>فایل PDF را اینجا رها کنید</h3><p class="description">یا از دستگاه انتخاب کنید</p><input type="file" accept=".pdf,application/pdf" id="file" style="max-width:240px" onchange="pdfCheck(this.files[0])"><p id="file-result" class="description">فایلی انتخاب نشده است.</p></div></div><p class="description" style="margin-top:18px">در این پیش‌نمایش هیچ فایلی به سرور ارسال نمی‌شود.</p></section>`}
function pdfCheck(f){document.getElementById('file-result').textContent=!f?'فایلی انتخاب نشده است.':!f.name.toLowerCase().endsWith('.pdf')?'فقط PDF مجاز است.':f.size>10485760?'حجم بیش از ۱۰ مگابایت است.':`فایل انتخاب‌شده: ${f.name} (${(f.size/1048576).toFixed(2)} MB)`}
function settings(){return heading('تنظیمات','شخصی‌سازی حالت نمایش')+`<section class="panel"><div class="panel-title">تم رابط کاربری</div><div class="panel-sub">برای مشاهده حالت تاریک از کنترل بالا استفاده کنید.</div><button class="button" onclick="toggleTheme()">تغییر تم روشن / تاریک</button><p class="description">در کد Next.js، حالت System نیز پشتیبانی می‌شود.</p></section>`}
function render(){document.getElementById('role').value=role;document.getElementById('nav-title').textContent=role==='admin'?'فضای مدیریت':'فضای کاربری';document.getElementById('breadcrumb').textContent=role==='admin'?'فضای مدیریت':'فضای کاربری';document.querySelector('.avatar').textContent=role==='admin'?'م':'ک';document.getElementById('nav').innerHTML=navs[role].map(x=>`<button class="nav ${view===x[0]?'active':''}" onclick="navigate('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');document.getElementById('mobilebar').innerHTML=navs[role].slice(0,4).map(x=>`<button class="${view===x[0]?'active':''}" onclick="navigate('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');document.getElementById('content').innerHTML=(view==='home'?home():view==='settings'?settings():role==='user'&&view==='statements'?upload():role==='user'&&(view==='credit'||view==='checks')?form():list())+`<footer class="footer">شرکت پخش پدیده پایدار · پیش‌نمایش HTML مستقل از برنامه Next.js · داده‌های ساختگی</footer>`}
render();
</script></body></html>
